<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Médiacom · Régie de stand</title>
  <meta name="description" content="Application de stand Médiacom : capture des contacts, mur LED interactif, book, devis et scène 3D, synchronisés sur le Wi-Fi du stand.">
  <meta name="theme-color" content="#04080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Médiacom">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/logo-m.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="preload" href="/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jbmono-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/os.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="horizon"></i><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="grain"></i></div>

  <div class="app">
    <nav class="rail" aria-label="Navigation principale">
      <a class="rail-logo" href="#regie" aria-label="Médiacom, accueil régie"></a>
      <div class="rail-keys" id="rail-keys"></div>
      <div class="rail-foot">
        <div class="hub-led" id="hub-led" title="État de la synchronisation"><span class="led"></span><span>Hub</span></div>
      </div>
    </nav>

    <header class="top">
      <div class="top-title">
        <span class="idx" id="view-idx">01</span>
        <h1 id="view-title">Régie</h1>
        <span class="sub" id="view-sub"></span>
      </div>
      <div class="tc" aria-label="Événement et heure">
        <span class="led" data-s="hot" id="tc-led"></span>
        <span class="ev" id="tc-event">Salon</span>
        <span class="sep ev"></span>
        <span class="clock-wrap"><span class="clock" id="tc-clock">00:00:00</span></span>
      </div>
      <div class="crew" id="crew" aria-label="Équipe connectée"></div>
      <button class="op-btn" id="op-btn" aria-label="Changer d’opérateur"></button>
    </header>

    <main class="stage" id="stage" tabindex="-1">
      <section class="view" id="v-regie" aria-labelledby="view-title"></section>
      <section class="view" id="v-contacts"></section>
      <section class="view" id="v-mur"></section>
      <section class="view" id="v-book"></section>
      <section class="view" id="v-devis"></section>
      <section class="view" id="v-scene"></section>
      <section class="view" id="v-elec"></section>
      <section class="view" id="v-pass"></section>
    </main>
  </div>

  <button class="go" id="go" aria-label="Nouveau contact"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Nouveau contact</span></button>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>
  <dialog class="sheet" id="sheet"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="show" id="show" role="dialog" aria-label="Présentation plein écran"></div>
</body>
</html>
