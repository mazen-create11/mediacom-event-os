<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Médiacom · Participez</title>
  <meta name="description" content="Participez en direct sur l’écran du stand Médiacom : nuage de mots, sondage, questions.">
  <meta name="theme-color" content="#04080f">
  <link rel="icon" href="/assets/logo-m.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="preload" href="/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/os.css">
  <style>
    body { min-height: 100dvh; overflow-x: hidden; }
    .v { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; padding: calc(20px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
    .v-brand { display: flex; align-items: center; gap: 12px; min-height: 40px; }
    .v-brand svg { width: 32px; color: #fff; filter: drop-shadow(0 0 12px rgba(49,146,255,.5)); }
    .v-brand b { font-weight: 600; letter-spacing: .2em; font-size: 14px; }
    .v-brand small { display: block; font: 500 10px/1.3 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--blue-2); }
    .v-brand .client { height: 38px; width: auto; max-width: 60vw; object-fit: contain; }
    .v-brand .by { margin-left: auto; font: 500 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); }
    .v-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 0 18px; }
    .v h1 { margin: 10px 0 0; font: 500 clamp(28px, 8vw, 40px)/1.08 var(--f-ui); letter-spacing: -.02em; text-wrap: balance; }
    .v-panel { margin-top: 24px; animation: rise 500ms var(--ease-out) both; }
    .v-form { position: relative; }
    .v-in { width: 100%; height: 66px; padding: 0 76px 0 20px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1px solid var(--line-3); font: 500 21px/1 var(--f-ui); color: #fff; -webkit-appearance: none; transition: border-color var(--d-2), box-shadow var(--d-2); }
    .v-in:focus, .v-ta:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 5px rgba(49,146,255,.18); }
    .v-in::placeholder, .v-ta::placeholder { color: #55637a; }
    .v-send { position: absolute; right: 8px; top: 8px; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--blue-fill); color: #fff; box-shadow: 0 8px 24px -8px var(--glow); transition: transform var(--d-1) var(--ease-out), opacity var(--d-2); }
    .v-send:active { transform: scale(.94); }
    .v-send svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .v-send[disabled] { opacity: .45; }
    .v-meta { display: flex; justify-content: space-between; margin-top: 10px; font: 500 12px/1 var(--f-mono); color: var(--text-3); }
    .v-sugg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .v-sugg button { height: 40px; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line-2); font-size: 15px; color: var(--text-2); }
    .v-sugg button:active { background: rgba(49,146,255,.15); color: #fff; }
    .v-msg { min-height: 54px; margin-top: 16px; }
    .v-ok { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(57,217,138,.08); border: 1px solid rgba(57,217,138,.35); animation: rise 500ms var(--ease-out) both; }
    .v-ok b { font-weight: 500; }
    .v-err { padding: 14px 16px; border-radius: 14px; background: rgba(255,181,71,.08); border: 1px solid rgba(255,181,71,.35); color: #ffd79a; animation: rise 400ms var(--ease-out) both; }
    .fly { position: fixed; z-index: 5; left: 50%; font: 600 30px/1 var(--f-ui); color: #fff; text-shadow: 0 0 18px var(--blue), 0 0 40px var(--blue-fill); pointer-events: none; white-space: nowrap; }
    /* Sondage */
    .v-opts { display: grid; gap: 10px; }
    .v-opt { position: relative; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--line-2); text-align: left; font: 500 17px/1.25 var(--f-ui); color: #fff; overflow: hidden; transition: border-color var(--d-2), background-color var(--d-2), transform var(--d-1); }
    .v-opt:active { transform: scale(.985); }
    .v-opt .k { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-3); display: grid; place-items: center; font: 600 12px/1 var(--f-mono); color: var(--text-2); }
    .v-opt[aria-pressed="true"] { border-color: var(--blue); background: rgba(49,146,255,.12); }
    .v-opt[aria-pressed="true"] .k { background: var(--blue-fill); border-color: var(--blue-fill); color: #fff; }
    .v-opt .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--blue); transform-origin: 0 50%; transform: scaleX(var(--v, 0)); transition: transform 900ms var(--ease-spring); }
    .v-opt .pct { margin-left: auto; font: 600 15px/1 var(--f-mono); color: var(--blue-2); font-variant-numeric: tabular-nums; }
    .v-opt.res { pointer-events: none; }
    .v-opt.res.mine { border-color: rgba(49,146,255,.6); }
    .v-opt.lead .pct { color: #fff; }
    .v-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .v-btn { height: 52px; padding: 0 20px; border-radius: 14px; font: 600 13px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
    .v-btn.pri { flex: 1; background: var(--blue-fill); box-shadow: 0 8px 24px -8px var(--glow); }
    .v-btn.pri[disabled] { opacity: .4; }
    .v-btn.quiet { background: rgba(255,255,255,.04); border: 1px solid var(--line-2); color: var(--text-2); }
    .v-total { margin-top: 12px; font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
    /* Questions */
    .v-ta { width: 100%; min-height: 104px; padding: 16px 18px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1px solid var(--line-3); font: 500 18px/1.3 var(--f-ui); color: #fff; resize: none; -webkit-appearance: none; }
    .v-qlist { display: grid; gap: 8px; margin-top: 22px; }
    .v-q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; border-radius: 14px; background: rgba(10,17,30,.8); border: 1px solid var(--line); animation: rise 500ms var(--ease-out) both; }
    .v-q p { margin: 0; font-size: 15px; line-height: 1.3; }
    .v-q.done p { color: var(--text-3); text-decoration: line-through; }
    .v-q .up { display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 12px 0 8px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); font: 600 13px/1 var(--f-mono); color: var(--text-2); }
    .v-q .up svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .v-q .up[aria-pressed="true"] { border-color: var(--blue); background: rgba(49,146,255,.15); color: #fff; }
    .v-q .tag { font: 500 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--blue-2); display: block; margin-top: 5px; }
    .v-qh { display: flex; align-items: baseline; justify-content: space-between; margin-top: 26px; }
    .v-qh span { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
    /* Attente */
    .v-wait { text-align: center; padding: 30px 0 10px; }
    .v-wait .eye { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-3); background: rgba(49,146,255,.08); }
    .v-wait .eye svg { width: 28px; height: 28px; fill: none; stroke: var(--blue-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .v-wait p { margin: 8px 0 0; color: var(--text-2); font-size: 15px; }
    .v-foot { display: flex; flex-direction: column; gap: 10px; }
    .v-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: rgba(10,17,30,.8); border: 1px solid var(--line-2); }
    .v-card svg { width: 22px; height: 22px; stroke: var(--blue-2); fill: none; stroke-width: 1.8; flex: none; }
    .v-card b { font-weight: 500; display: block; }
    .v-card span { color: var(--text-2); font-size: 13.5px; }
    .v-legal { text-align: center; font-size: 11.5px; color: var(--text-3); margin: 6px 0 0; }
    .v-closed { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="horizon"></i><i class="grain"></i></div>
  <main class="v">
    <header class="v-brand" id="brand"></header>
    <section class="v-main">
      <span class="eyebrow" id="ev">Écran du stand</span>
      <h1 id="q">Participez</h1>
      <div id="panel"></div>
      <div class="v-msg" id="msg" aria-live="polite"></div>
    </section>
    <footer class="v-foot">
      <a class="v-card" href="/contact"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg><div><b>Un projet ? Gardez notre contact</b><span>Son, lumière, image, scène mobile</span></div></a>
      <p class="v-legal">Aucune donnée personnelle collectée. Liens et propos injurieux sont refusés, l’équipe peut retirer un message à tout moment.</p>
    </footer>
  </main>
  <script type="module">
    import { LOGO_M, esc } from '/js/ui.js';
    import { wallFeed } from '/js/hub.js';
    const $ = (s) => document.querySelector(s);
    const pid = (() => { try { let v = localStorage.getItem('mc_pid'); if (!v) { v = 'p-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('mc_pid', v); } return v; } catch { return 'p-' + Math.random().toString(36).slice(2, 10); } })();
    const SUGG = ['Séminaire', 'Convention', 'Plénière', 'Incentive', 'Soirée d’entreprise', 'Congrès', 'Team building', 'Gala'];
    const UP = '<svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>';
    const state = { wall: {}, poll: null, questions: [], scene: null, myVote: null, myUps: new Set(JSON.parse(localStorage.getItem('mc_ups') || '[]')), sent: Number(sessionStorage.getItem('mc_sent') || 0), picks: new Set() };
    let lastPanel = '';

    function msg(kind, html) {
      $('#msg').innerHTML = kind === 'ok' ? `<div class="v-ok"><span class="led on"></span><div><b>${html}</b><br><span class="muted" style="font-size:14px">Levez les yeux vers l’écran.</span></div></div>` : kind === 'err' ? `<div class="v-err">${html}</div>` : '';
    }
    async function post(url, body) {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, pid }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { const e = new Error(d.error || 'Envoi impossible pour le moment'); e.data = d; e.status = r.status; throw e; }
      return d;
    }
    const netErr = (e) => esc(e.message === 'Failed to fetch' ? 'Pas de connexion à l’écran. Vérifiez que vous êtes sur le Wi-Fi du stand.' : e.message);

    /* ---------- En-tête ---------- */
    function renderBrand() {
      const t = state.wall.theme || {};
      $('#brand').innerHTML = t.logo
        ? `<img class="client" src="${t.logo}" alt="${esc(t.client || '')}"><span class="by">avec Médiacom</span>`
        : `${LOGO_M}<div><b>MEDIACOM</b><small>Le son · la lumière · l’image</small></div>`;
    }

    /* ---------- Panneaux ---------- */
    function render() {
      const w = state.wall;
      const scene = w.scene || 'cloud';
      const key = scene + '|' + (state.poll?.id || '') + '|' + (w.accept !== false) + '|' + (w.qaOpen !== false) + '|' + (state.poll?.open !== false);
      if (scene === 'cloud') {
        $('#ev').textContent = 'Nuage de mots';
        $('#q').textContent = w.question || 'Votre prochain événement, en un mot ?';
        if (key !== lastPanel) {
          $('#panel').innerHTML = w.accept === false ? `<div class="v-closed"><span class="led"></span>Réponses closes · merci</div>` : `<div class="v-panel">
            <form class="v-form" id="f" autocomplete="off"><label class="sr" for="w">Votre mot</label>
              <input class="v-in" id="w" maxlength="28" placeholder="Votre mot" enterkeyhint="send" autocapitalize="sentences" spellcheck="true">
              <button class="v-send" id="s" aria-label="Envoyer sur l’écran"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
              <div class="v-meta"><span id="n">0 / 28</span><span id="sent"></span></div></form>
            <div class="v-sugg" id="sugg">${SUGG.map((s) => `<button type="button">${s}</button>`).join('')}</div></div>`;
          bindCloud();
        }
      } else if (scene === 'poll') {
        const p = state.poll;
        $('#ev').textContent = 'Sondage';
        $('#q').textContent = p?.title || 'Le sondage arrive…';
        if (key !== lastPanel) { $('#panel').innerHTML = p ? '<div class="v-panel" id="poll"></div>' : '<div class="v-wait"><p>La tablette prépare le sondage.</p></div>'; state.picks.clear(); }
        if (p) renderPoll();
      } else if (scene === 'questions') {
        $('#ev').textContent = 'Vos questions';
        $('#q').textContent = w.qaTitle || 'Une question pour les intervenants ?';
        if (key !== lastPanel) {
          $('#panel').innerHTML = `<div class="v-panel">${w.qaOpen === false ? '<div class="v-closed"><span class="led"></span>Questions closes</div>' : `
            <form id="qf"><label class="sr" for="qt">Votre question</label><textarea class="v-ta" id="qt" maxlength="180" placeholder="Écrivez votre question" enterkeyhint="send"></textarea>
            <div class="v-meta"><span id="qn">0 / 180</span></div>
            <div class="v-actions"><button class="v-btn pri" id="qs">Envoyer ma question</button></div></form>`}
            <div class="v-qh"><span>Questions du public</span><span id="qcount"></span></div><div class="v-qlist" id="ql"></div></div>`;
          bindQA();
        }
        renderQA();
      } else {
        const labels = { reel: 'Nos réalisations défilent sur l’écran.', mediascene: 'La scène mobile MediaScène est à l’écran.', message: w.message || 'Bienvenue sur le stand Médiacom', black: 'L’écran reprend dans un instant.', external: 'Suivez l’animation sur l’écran.' };
        $('#ev').textContent = 'Écran du stand';
        $('#q').textContent = 'Regardez l’écran';
        if (key !== lastPanel) $('#panel').innerHTML = `<div class="v-wait"><div class="eye"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div><p id="wait-p"></p></div>`;
        $('#wait-p').textContent = labels[scene] || labels.black;
      }
      if (key !== lastPanel) { lastPanel = key; $('#msg').innerHTML = ''; }
    }

    /* ---------- Nuage ---------- */
    const showSent = () => { const s = $('#sent'); if (s) s.textContent = state.sent ? `${state.sent} envoyé${state.sent > 1 ? 's' : ''}` : ''; };
    function bindCloud() {
      const input = $('#w'); if (!input) return;
      showSent();
      input.addEventListener('input', () => ($('#n').textContent = `${input.value.length} / 28`));
      $('#sugg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { input.value = b.textContent; input.dispatchEvent(new Event('input')); sendWord(); } });
      $('#f').addEventListener('submit', (e) => { e.preventDefault(); sendWord(); });
      let busy = false;
      async function sendWord() {
        const text = input.value.trim();
        if (!text || busy) return;
        busy = true; $('#s').disabled = true;
        try {
          const d = await post('/api/words', { text });
          fly(text, input);
          state.sent++; sessionStorage.setItem('mc_sent', state.sent); showSent();
          msg('ok', `« ${esc(d.word?.text || text)} » est sur l’écran.`);
          input.value = ''; input.dispatchEvent(new Event('input'));
          navigator.vibrate?.(30);
        } catch (e) { msg('err', netErr(e)); }
        finally { busy = false; $('#s').disabled = false; input.focus(); }
      }
    }
    function fly(text, from) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const r = from.getBoundingClientRect();
      const f = Object.assign(document.createElement('div'), { className: 'fly', textContent: text });
      f.style.top = `${r.top + 18}px`;
      document.body.append(f);
      f.animate([{ transform: 'translate(-50%, 0) scale(1)', opacity: 1, filter: 'blur(0)' }, { transform: `translate(-50%, ${-r.top - 120}px) scale(.6)`, opacity: 0, filter: 'blur(6px)' }], { duration: 1100, easing: 'cubic-bezier(.5,0,.75,0)' }).finished.then(() => f.remove());
    }

    /* ---------- Sondage ---------- */
    function renderPoll() {
      const p = state.poll, host = $('#poll');
      if (!host) return;
      const voted = state.myVote && state.myVote.pollId === p.id;
      const total = p.total || p.options.reduce((s, o) => s + (o.count || 0), 0);
      const max = Math.max(1, ...p.options.map((o) => o.count || 0));
      const closed = p.open === false;
      if (voted || closed) {
        host.innerHTML = `<div class="v-opts">${p.options.map((o, i) => `<div class="v-opt res ${voted && state.myVote.picks.includes(o.id) ? 'mine' : ''} ${total && o.count === max ? 'lead' : ''}" style="--v:${total ? (o.count / max).toFixed(3) : 0}"><span class="k">${String.fromCharCode(65 + i)}</span><span>${esc(o.label)}</span><span class="pct">${total ? Math.round((o.count / total) * 100) : 0} %</span><i class="bar"></i></div>`).join('')}</div>
          <div class="v-total">${total} vote${total > 1 ? 's' : ''}${closed ? ' · vote clos' : ''}</div>
          ${closed ? '' : `<div class="v-actions"><button class="v-btn quiet" id="revote">Modifier mon vote</button></div>`}`;
        host.querySelector('#revote')?.addEventListener('click', () => { state.picks = new Set(state.myVote.picks); state.myVote = null; renderPoll(); });
        return;
      }
      host.innerHTML = `<div class="v-opts" role="${p.multiple ? 'group' : 'radiogroup'}">${p.options.map((o, i) => `<button class="v-opt" data-id="${o.id}" aria-pressed="${state.picks.has(o.id)}"><span class="k">${String.fromCharCode(65 + i)}</span><span>${esc(o.label)}</span></button>`).join('')}</div>
        <div class="v-actions"><button class="v-btn pri" id="vote" ${state.picks.size ? '' : 'disabled'}>Voter</button></div>
        ${p.multiple ? '<div class="v-total">Plusieurs réponses possibles</div>' : ''}`;
      host.querySelectorAll('[data-id]').forEach((b) => b.addEventListener('click', () => {
        const id = b.dataset.id;
        if (p.multiple) { state.picks.has(id) ? state.picks.delete(id) : state.picks.add(id); }
        else { state.picks.clear(); state.picks.add(id); }
        host.querySelectorAll('[data-id]').forEach((x) => x.setAttribute('aria-pressed', state.picks.has(x.dataset.id)));
        $('#vote').disabled = !state.picks.size;
        if (!p.multiple) vote();
      }));
      $('#vote').addEventListener('click', vote);
      async function vote() {
        if (!state.picks.size) return;
        $('#vote').disabled = true;
        try {
          const d = await post('/api/poll/vote', { optionIds: [...state.picks], change: true });
          state.myVote = { pollId: p.id, picks: d.mine || [...state.picks] };
          if (d.poll) state.poll = d.poll;
          navigator.vibrate?.(30);
          msg('ok', 'Vote enregistré.');
          renderPoll();
        } catch (e) { msg('err', netErr(e)); $('#vote').disabled = false; }
      }
    }

    /* ---------- Questions ---------- */
    function bindQA() {
      const ta = $('#qt'); if (!ta) return;
      ta.addEventListener('input', () => ($('#qn').textContent = `${ta.value.length} / 180`));
      ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#qf').requestSubmit(); } });
      $('#qf').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = ta.value.trim();
        if (text.length < 4) return;
        $('#qs').disabled = true;
        try {
          const d = await post('/api/questions', { text });
          ta.value = ''; ta.dispatchEvent(new Event('input'));
          msg('ok', 'Question envoyée.');
          if (d.question) { state.questions = [...state.questions.filter((q) => q.id !== d.question.id), d.question]; renderQA(); }
          navigator.vibrate?.(30);
        } catch (e) { msg('err', netErr(e)); }
        finally { $('#qs').disabled = false; }
      });
      $('#ql').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-up]'); if (!b) return;
        const id = b.dataset.up;
        b.disabled = true;
        try {
          const d = await post('/api/questions/vote', { id });
          if (d.voted) state.myUps.add(id); else state.myUps.delete(id);
          localStorage.setItem('mc_ups', JSON.stringify([...state.myUps]));
          const q = state.questions.find((x) => x.id === id); if (q && d.question) Object.assign(q, d.question);
          renderQA();
        } catch (err) { msg('err', netErr(err)); }
        finally { b.disabled = false; }
      });
    }
    function renderQA() {
      const host = $('#ql'); if (!host) return;
      const list = [...state.questions].filter((q) => !q.hidden).sort((a, b) => (b.pinned - a.pinned) || (a.answered - b.answered) || (b.votes - a.votes) || (b.at - a.at));
      $('#qcount').textContent = list.length ? `${list.length}` : '';
      host.innerHTML = list.length ? list.map((q) => `<div class="v-q ${q.answered ? 'done' : ''}"><div><p>${esc(q.text)}</p>${q.pinned ? '<span class="tag">À l’écran</span>' : q.answered ? '<span class="tag">Répondu</span>' : ''}</div><button class="up" data-up="${q.id}" aria-pressed="${state.myUps.has(q.id)}" aria-label="Soutenir cette question">${UP}${q.votes || 0}</button></div>`).join('') : '<p class="dim" style="margin:0;font-size:14px">Soyez le premier à poser une question.</p>';
    }

    /* ---------- Flux de l'écran ---------- */
    wallFeed((d) => {
      if (d.wall) { state.wall = d.wall; renderBrand(); }
      if (d.poll !== undefined) state.poll = d.poll;
      if (d.questions) state.questions = d.questions;
      if (d.question && !state.questions.find((q) => q.id === d.question.id)) state.questions.push(d.question);
      render();
    });
    renderBrand();
    render();
  </script>
</body>
</html>
